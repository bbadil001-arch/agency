<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-labelledby="title desc">
  <title id="title">YHD Agency logo</title>
  <desc id="desc">Geometric gradient YHD monogram with YHD Agency wordmark</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D4AFF"/>
      <stop offset="0.55" stop-color="#B45BDE"/>
      <stop offset="1" stop-color="#FFB45B"/>
    </linearGradient>
  </defs>

  <!-- Monogram: Y + H + D, built from simple geometric strokes -->
  <g fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 30 L70 74 L114 30"/>
    <path d="M70 74 V130"/>
    <path d="M104 74 H154 M104 130 H154 M154 74 V130"/>
    <path d="M174 30 V130 H204 C244 130 264 110 264 80 C264 50 244 30 204 30 H174"/>
  </g>

  <text x="316" y="103" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1.5">YHD</text>
  <text x="451" y="103" fill="#A7A6B3" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="500" letter-spacing="1.5">AGENCY</text>
</svg>
