<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" role="img" aria-labelledby="title desc">
  <title id="title">YHD Agency simple logo</title>
  <desc id="desc">Minimal YHD Agency logo with a geometric Y symbol</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7657FF"/>
      <stop offset="1" stop-color="#F2A45D"/>
    </linearGradient>
  </defs>

  <!-- Minimal standalone Y symbol -->
  <rect x="18" y="18" width="104" height="104" rx="28" fill="url(#accent)"/>
  <path d="M43 43 L70 70 L97 43 M70 70 V99" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clean wordmark -->
  <text x="153" y="78" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="700" letter-spacing="1.2">YHD</text>
  <text x="153" y="108" fill="#9B9AA8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="5.5">AGENCY</text>
</svg>
